<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Matchup Analyzer</title>
<style>
  :root{--bg:#0a1628;--panel:#111f36;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--border:#243044;--text:#e8eef7;--sub:#8fa3bd;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding:0 0 60px;}
  header{background:linear-gradient(90deg,#0a1628,#16233d);padding:18px 26px;border-bottom:2px solid var(--accent);}
  h1{font-size:22px;font-weight:800;} h1 span{color:var(--accent);}
  .sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .picker{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:22px 26px;background:var(--panel);border-bottom:1px solid var(--border);}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);font-weight:700;}
  select{background:#0d1a30;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:15px;min-width:240px;font-weight:600;}
  .at{font-size:13px;color:var(--sub);padding-bottom:12px;font-weight:700;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer;}
  button:hover{background:#2563eb;}
  .wrap{padding:24px 26px;max-width:1100px;margin:0 auto;}
  .empty{color:var(--sub);text-align:center;padding:60px 20px;font-size:15px;}
  .headline{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px;}
  .tm{text-align:center;} .tm.home{text-align:center;}
  .tm .name{font-size:18px;font-weight:800;margin-bottom:8px;}
  .tm .winprob{font-size:40px;font-weight:800;}
  .tm .wl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .tm .score{font-size:28px;font-weight:800;color:var(--accent);margin-top:8px;}
  .vs{text-align:center;color:var(--sub);font-weight:800;font-size:13px;}
  .totalbox{text-align:center;margin-top:10px;}
  .totalbox .t{font-size:30px;font-weight:800;}
  .lean{display:inline-block;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;margin-top:6px;}
  .lean.high{background:rgba(239,68,68,.18);color:#fca5a5;} .lean.low{background:rgba(59,130,246,.18);color:#93c5fd;} .lean.mid{background:rgba(148,163,184,.18);color:#cbd5e1;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:760px){.cards{grid-template-columns:1fr;} .headline{grid-template-columns:1fr;} select{min-width:200px;}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin-bottom:12px;}
  .edge{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .edge:last-child{border-bottom:none;}
  .edge .lab{color:var(--sub);} .edge .val{font-weight:700;}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px;margin-left:6px;}
  .tag.big{background:rgba(34,197,94,.2);color:#86efac;} .tag.small{background:rgba(148,163,184,.18);color:#cbd5e1;}
  .bar{height:8px;background:#0d1a30;border-radius:4px;overflow:hidden;margin-top:4px;}
  .bar>div{height:100%;background:var(--accent);}
  .signal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:16px;}
  .signal h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin-bottom:10px;}
  .signal ul{list-style:none;} .signal li{padding:7px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.4;}
  .signal li:last-child{border-bottom:none;}
  .signal li b{color:var(--accent);}
  .disc{font-size:11px;color:var(--sub);margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <h1><span>NFL</span> Matchup Analyzer</h1>
  <div class="sub">2026 season model · based on Warren Sharp preview data (offensive/defensive efficiency per drive + unit rankings)</div>
</header>

<div class="picker">
  <div class="field"><label>Away Team</label><select id="away"></select></div>
  <div class="at">@</div>
  <div class="field"><label>Home Team</label><select id="home"></select></div>
  <button onclick="analyze()">Analyze Matchup</button>
</div>

<div class="wrap" id="out">
  <div class="empty">Pick two teams and press Analyze Matchup.</div>
</div>

<script src="team_data.js"></script>
<script src="coverage_data.js"></script>
<script src="trench_data.js"></script>
<script src="efficiency_data.js"></script>
<script src="forecast_data.js"></script>
<script>
var DATA = null;
var FORECAST = (typeof FORECAST_DATA !== 'undefined') ? FORECAST_DATA : null;
var COV = (typeof COVERAGE_DATA !== 'undefined') ? COVERAGE_DATA : null;
var TRENCH = (typeof TRENCH_DATA !== 'undefined') ? TRENCH_DATA : null;
var EFF = (typeof EFFICIENCY_DATA !== 'undefined') ? EFFICIENCY_DATA : null;

// ---- League baselines (actual 2025 averages computed from the data) ----
var LG_PTS_PER_DRIVE = 2.11;     // real league-avg points per drive (both sides average ~2.11)
var DRIVES_PER_TEAM = 11;        // ~11 offensive drives per team per game
var LG_YDS_PER_DRIVE = 31.05;    // real league-avg yards per drive
var LG_TO_PER_DRIVE = 10.47;     // real league-avg turnovers per 100 drives (%)
var LG_RZ_PCT = 30.66;           // real league-avg red-zone drive %
var HOME_EDGE_PTS = 1.8;         // NFL home field (modern consensus ~1.5-2.0)

// ---- FOUR FACTORS weights (Four Factors framework, aggregate-stat based) ----
// Efficiency dominates, then turnovers, then explosiveness, then situational/field position.
var FF_EFFICIENCY = 0.45;        // points & yards per drive
var FF_TURNOVERS  = 0.25;        // ball security / takeaways
var FF_EXPLOSIVE  = 0.18;        // explosive-play rate
var FF_SITUATION  = 0.12;        // red-zone + 3-and-out (sustaining/finishing drives)
// Season scoring rates are noisy/over-dispersed (schedule luck, garbage time). Regress every team's
// rating toward the league mean by this fraction to recover true talent. ~30-40% is the established
// range; without it the model over-rates 2025-strong teams and under-rates weak ones across the board.
var REGRESS = 0.35;

// Forward-looking forecast anchor (Sharp 2026 win totals) applied to TEAM STRENGTH only.
var LG_AVG_WINS = 8.5;
var WINS_TO_PTS = 0.55;          // pts/game of strength per win above/below average
var FORECAST_WEIGHT = 0.30;      // modest pull so the season stats lead

function rankScore(rk){ if(!rk) return 0; return (16.5 - rk)/15.5; }

function load(){
  if(typeof TEAM_DATA === 'undefined'){
    document.getElementById('out').innerHTML='<div class="empty">Could not load team_data.js (keep it in the same folder as this page).</div>';
    return;
  }
  DATA = TEAM_DATA;
  var teams = Object.keys(DATA.teams).sort();
  var a=document.getElementById('away'), h=document.getElementById('home');
  teams.forEach(function(t){
    a.add(new Option(t,t)); h.add(new Option(t,t));
  });
  a.selectedIndex=0; h.selectedIndex=1;
}

// ---- FOUR FACTORS RATING (built on real aggregate values, not ranks) ----
// Produces, for a team, an offensive points-per-drive rating and a defensive points-per-drive-allowed
// rating. The team's actual pts/drive is the backbone; the other three factors (turnovers,
// explosiveness, situational) adjust it so a team whose scoring was e.g. turnover-luck-driven or
// field-position-driven is corrected toward what its underlying play actually supports.
//
// factorSignal returns a small multiplier around 1.0 from the non-scoring factors.
// Work in POINTS-ABOVE-AVERAGE space so the pts/drive edge is preserved (the old ratio-average
// diluted a good offense back to ~average). Backbone = regressed pts/drive edge. The secondary
// factors (yards/drive, turnovers, explosiveness) add only SMALL tilts, they cannot erase the backbone.
function offFourFactors(t){
  var o = t.offense_2025; if(!o || o.pts_per_drive==null) return LG_PTS_PER_DRIVE;
  var name = teamName(t);
  var ef = EFF && EFF.off_eff_ranks && EFF.off_eff_ranks[name];
  // Backbone: points/drive edge vs average, regressed for noise.
  var ptsEdge = (1-REGRESS)*(o.pts_per_drive - LG_PTS_PER_DRIVE);
  // Small yards/drive tilt (supports/undercuts the points edge), scaled to points.
  var ydsRaw = (o.yds_per_drive!=null ? o.yds_per_drive : LG_YDS_PER_DRIVE);
  var ydsEdge = (1-REGRESS)*((ydsRaw - LG_YDS_PER_DRIVE)/LG_YDS_PER_DRIVE) * LG_PTS_PER_DRIVE * 0.5;
  // Turnover tilt: fewer giveaways than avg => small positive pts.
  var toDelta = (LG_TO_PER_DRIVE - (o.to_per_drive_pct!=null?o.to_per_drive_pct:LG_TO_PER_DRIVE)) * 0.015;
  // Explosiveness tilt from rank (small).
  var explDelta = ef ? rankScore(ef.explosive_play)*0.10 : 0;
  var edge = 0.75*ptsEdge + 0.15*ydsEdge + 0.06*toDelta + 0.04*explDelta;
  return LG_PTS_PER_DRIVE + edge;
}
function defFourFactors(t){
  var d = t.defense_2025; if(!d || d.pts_per_drive==null) return LG_PTS_PER_DRIVE;
  // Backbone: points/drive ALLOWED edge vs average (lower allowed = better = negative edge).
  var ptsEdge = (1-REGRESS)*(d.pts_per_drive - LG_PTS_PER_DRIVE);
  var ydsRaw = (d.yds_per_drive!=null ? d.yds_per_drive : LG_YDS_PER_DRIVE);
  var ydsEdge = (1-REGRESS)*((ydsRaw - LG_YDS_PER_DRIVE)/LG_YDS_PER_DRIVE) * LG_PTS_PER_DRIVE * 0.5;
  // More takeaways than avg => suppresses opponent points (negative edge).
  var toDelta = -((d.to_per_drive_pct!=null?d.to_per_drive_pct:LG_TO_PER_DRIVE) - LG_TO_PER_DRIVE) * 0.015;
  var edge = 0.80*ptsEdge + 0.15*ydsEdge + 0.05*toDelta;
  return LG_PTS_PER_DRIVE + edge;
}

// Matchup expected points: combine THIS offense's pts/drive rating with the OPPONENT defense's
// pts/drive-allowed rating on the real points scale (log5-style: both relative to league average).
// expected pts/drive = LG * (offRating/LG) * (defRating/LG)  -> then regress lightly to the mean.
// ADDITIVE combination (not multiplicative): expected pts/drive = league avg
//   + how much THIS offense is above/below average
//   + how much the OPPONENT defense is above/below average (allowing more/fewer than avg).
// Additive avoids the multiplicative structure compounding extremes (elite D x good O ran away).
function expectedPointsFF(offTeam, defTeam){
  var offR = offFourFactors(offTeam);          // regressed offensive pts/drive rating
  var defR = defFourFactors(defTeam);          // regressed defensive pts/drive-allowed rating
  var offEdge = offR - LG_PTS_PER_DRIVE;       // + = above-average offense
  var defEdge = defR - LG_PTS_PER_DRIVE;       // + = below-average defense (allows more)
  var pd = LG_PTS_PER_DRIVE + offEdge + defEdge;
  if(pd < 0.3) pd = 0.3;                        // floor
  return pd * DRIVES_PER_TEAM;
}

// Standard normal CDF via Abramowitz & Stegun 7.1.26 approximation (accurate to ~1e-7).
function normCdf(x){
  var t = 1/(1+0.2316419*Math.abs(x));
  var d = 0.3989422804014327*Math.exp(-x*x/2);
  var p = d*t*(0.31938153 + t*(-0.356563782 + t*(1.781477937 + t*(-1.821255978 + t*1.330274429))));
  return x >= 0 ? 1-p : p;
}

// Win probability from an expected point margin, modelling final margin ~ Normal(mu, sigma^2).
// This is the PFR / Stern-Winston approach. sigma ~14 for model projections (noisier than market
// lines, which use ~13.3). Includes the classic 0.5 continuity correction + half-tie mass.
var MARGIN_SIGMA = 14.0;   // tunable; calibrate against historical residuals later
function winProbFromMargin(mu, sigma){
  sigma = sigma || MARGIN_SIGMA;
  var pWinOutright = 1 - normCdf((0.5 - mu)/sigma);
  var pTie = normCdf((0.5 - mu)/sigma) - normCdf((-0.5 - mu)/sigma);
  return pWinOutright + 0.5*pTie;
}

// ---- EPA-based rating engine (research-weighted) ----
// Converts a 1-32 rank into a centered strength score: rank 1 -> +1, rank 16.5 -> 0, rank 32 -> -1.
function rankScore(rk){ if(!rk) return 0; return (16.5 - rk)/15.5; }

// Forward-looking team strength from Sharp's 2026 forecast win total, as points/game vs average.
// A team forecast for 11.5 wins is (11.5-8.5)*0.55 = +1.65 pts/game stronger than average.
function forecastStrength(teamN){
  if(!FORECAST || !FORECAST.forecast_wins || FORECAST.forecast_wins[teamN]===undefined) return null;
  return (FORECAST.forecast_wins[teamN] - LG_AVG_WINS) * WINS_TO_PTS;
}

// Overall roster/unit strength score (lower rank = better). Returns 0..100 (higher=better).
function rosterScore(t){
  var p = t.positional_ranks || (DATA.positional_unit_rankings_2026 && DATA.positional_unit_rankings_2026[teamName(t)]) ;
  if(!p) return 50;
  // weight units by impact on winning
  var w = {Quarterbacks:0.26,"Offensive Line":0.14,Receivers:0.12,"Running Backs":0.06,"Front 7":0.18,Secondary:0.16,"Head Coach":0.08};
  var s=0, tot=0;
  for(var k in w){ if(p[k]){ s += (33-p[k])*w[k]; tot += 32*w[k]; } }
  return Math.round((s/tot)*100);
}
function teamName(t){ // reverse lookup
  for(var n in DATA.teams){ if(DATA.teams[n]===t) return n; }
  return '';
}

function rk(t, side, key){ // fetch a rank safely
  var o = t[side]; if(!o) return null; return o[key]!==undefined?o[key]:null;
}

function analyze(){
  var awayN=document.getElementById('away').value, homeN=document.getElementById('home').value;
  if(awayN===homeN){ document.getElementById('out').innerHTML='<div class="empty">Pick two different teams.</div>'; return; }
  var away=DATA.teams[awayN], home=DATA.teams[homeN];
  away._n=awayN; home._n=homeN;

  // Expected points from the FOUR FACTORS engine (single principled model on real aggregate values:
  // efficiency, turnovers, explosiveness, situational). Each team's offense vs opponent's defense.
  var awayPts = expectedPointsFF(away, home);
  var homePts = expectedPointsFF(home, away) + HOME_EDGE_PTS;
  var base = LG_PTS_PER_DRIVE * DRIVES_PER_TEAM;

  // Forward-looking forecast anchor (Sharp 2026 win totals) applied to TEAM STRENGTH.
  // Win totals measure overall team quality, so we pull each team's points toward the forecast-
  // implied strength. Corrects the backward-looking bias (2025 stats miss 2026 roster/health).
  var awayFc = forecastStrength(awayN), homeFc = forecastStrength(homeN);
  if(awayFc!==null && homeFc!==null){
    awayPts = base + (1-FORECAST_WEIGHT)*(awayPts-base) + FORECAST_WEIGHT*awayFc;
    homePts = base + (1-FORECAST_WEIGHT)*(homePts-base-HOME_EDGE_PTS) + FORECAST_WEIGHT*homeFc + HOME_EDGE_PTS;
  }
  var total = awayPts + homePts;

  // --- Matchup adjustments (coverage/pressure) that MOVE the numbers ---
  // Each returns {text, awayAdj, homeAdj} point deltas applied to expected points.
  var adj = buildSignals(away, home, awayN, homeN);
  awayPts += adj.awayAdj;
  homePts += adj.homeAdj;
  total = awayPts + homePts;

  var margin = homePts - awayPts; // + means home favoured
  // Win prob: model final margin ~ Normal(margin, sigma^2) with sigma~14 (PFR/Stern-Winston method).
  // This is properly calibrated to real NFL margin scatter rather than a hand-tuned logistic.
  //   3 pts -> ~59%, 7 pts -> ~69%, 10 pts -> ~76%, 12 pts -> ~80%, 14 pts -> ~84%.
  var homeWP = winProbFromMargin(margin);
  // Cap extremes: no single NFL game is a lock. Keep win prob within 3%-97%.
  homeWP = Math.max(0.03, Math.min(0.97, homeWP));
  var awayWP = 1-homeWP;

  // Total lean
  var leanCls='mid', leanTxt='Average total';
  if(total>=48){ leanCls='high'; leanTxt='Leans OVER / high scoring'; }
  else if(total<=40){ leanCls='low'; leanTxt='Leans UNDER / low scoring'; }

  var signals = adj.text;

  var html = ''
    + '<div class="headline">'
      + tmBlock(awayN, awayWP, awayPts, false)
      + '<div class="vs">@<div class="totalbox"><div class="t">'+total.toFixed(0)+'</div><div class="lean '+leanCls+'">'+leanTxt+'</div></div></div>'
      + tmBlock(homeN, homeWP, homePts, true)
    + '</div>';

  html += '<div class="cards">'
      + unitCard(awayN, away) + unitCard(homeN, home)
    + '</div>';

  html += '<div class="signal"><h3>Standout Matchup Signals</h3><ul>'+signals+'</ul></div>';

  html += '<div class="disc">Model: a <b>Four Factors</b> rating built from real 2025 aggregate values — efficiency (points &amp; yards per drive, '+Math.round(FF_EFFICIENCY*100)+'%), turnovers ('+Math.round(FF_TURNOVERS*100)+'%), explosive-play rate ('+Math.round(FF_EXPLOSIVE*100)+'%) and situational red-zone/drive-sustaining ('+Math.round(FF_SITUATION*100)+'%). Each team\'s offensive rating meets the opponent\'s defensive rating on the points-per-drive scale across ~'+DRIVES_PER_TEAM+' drives, plus a '+HOME_EDGE_PTS+'-pt home edge. A forward-looking anchor from Sharp\'s 2026 forecast win totals ('+Math.round(FORECAST_WEIGHT*100)+'% pull) corrects for 2026 roster/health changes the raw 2025 stats miss. Matchup signals (trenches, QB coverage/pressure, turnover margin) refine each side within a cap. Win probability = Normal(margin, &sigma;&asymp;'+MARGIN_SIGMA+') (PFR/Stern-Winston). A data/analysis aid for screening matchups — weights are established defaults, not backtested to results, so treat it as a guide, not betting advice.</div>';

  document.getElementById('out').innerHTML = html;
}

function tmBlock(name, wp, pts, home){
  return '<div class="tm'+(home?' home':'')+'">'
    + '<div class="name">'+name+(home?' (H)':' (A)')+'</div>'
    + '<div class="winprob">'+(wp*100).toFixed(0)+'%</div>'
    + '<div class="wl">win prob</div>'
    + '<div class="score">'+pts.toFixed(0)+' pts</div>'
    + '</div>';
}

function unitCard(name, t){
  var p = t.positional_ranks || {};
  var order = ["Quarterbacks","Offensive Line","Receivers","Running Backs","Front 7","Secondary","Head Coach"];
  var rows = order.map(function(k){
    var v = p[k]; if(v===undefined) return '';
    var tag = v<=8?'<span class="tag big">top '+v+'</span>':(v>=25?'<span class="tag small">#'+v+'</span>':'');
    return '<div class="edge"><span class="lab">'+k+'</span><span class="val">#'+v+' '+tag+'</span></div>';
  }).join('');
  var oPD = t.offense_2025?t.offense_2025.pts_per_drive:'-';
  var oRk = t.offense_2025?t.offense_2025.pts_per_drive_rk:'-';
  var dPD = t.defense_2025?t.defense_2025.pts_per_drive:'-';
  var dRk = t.defense_2025?t.defense_2025.pts_per_drive_rk:'-';
  rows = '<div class="edge"><span class="lab">Offense pts/drive</span><span class="val">'+oPD+' (#'+oRk+')</span></div>'
       + '<div class="edge"><span class="lab">Defense pts/drive allowed</span><span class="val">'+dPD+' (#'+dRk+')</span></div>'
       + rows;

  // Trench detail from trench_data (only shows fields that exist)
  var tr = TRENCH && TRENCH.teams[name];
  if(tr){
    var trows = '';
    function trow(lab,val){ if(val!==undefined&&val!==null&&val!=='') trows += '<div class="edge"><span class="lab">'+lab+'</span><span class="val">'+val+'</span></div>'; }
    if(tr.def_pressure_rate!==undefined) trow('Def pressure rate', tr.def_pressure_rate+'%'+(tr.def_pressure_rate_rk?' (#'+tr.def_pressure_rate_rk+')':''));
    else if(tr.def_pressure_rate_rk!==undefined) trow('Def pressure rank', '#'+tr.def_pressure_rate_rk);
    if(tr.def_sacks!==undefined) trow('Sacks', tr.def_sacks+(tr.def_sacks_rk?' (#'+tr.def_sacks_rk+')':''));
    if(tr.def_rb_ypc!==undefined) trow('RB yds/carry allowed', tr.def_rb_ypc+(tr.def_rb_ypc_rk?' (#'+tr.def_rb_ypc_rk+')':''));
    else if(tr.def_rb_ypc_rk!==undefined) trow('Run-D rank', '#'+tr.def_rb_ypc_rk);
    if(tr.def_pass_ypa_allowed!==undefined) trow('Pass yds/att allowed', tr.def_pass_ypa_allowed+(tr.def_pass_ypa_allowed_rk?' (#'+tr.def_pass_ypa_allowed_rk+')':''));
    if(tr.ol_pbwr_rk!==undefined) trow('OL pass-block win rate', '#'+tr.ol_pbwr_rk);
    if(trows) rows += '<div class="edge" style="border-bottom:none;padding-top:10px;"><span class="lab" style="font-weight:700;color:#8fa3bd;">Trench detail</span><span></span></div>'+trows;
  }

  // EPA efficiency detail (priority metrics)
  var ef = EFF && EFF.off_eff_ranks && EFF.off_eff_ranks[name];
  var re = EFF && EFF.rush_eff && EFF.rush_eff[name];
  if(ef || re){
    var erows='';
    function erow(lab,val){ if(val!==undefined&&val!==null&&val!=='') erows += '<div class="edge"><span class="lab">'+lab+'</span><span class="val">'+val+'</span></div>'; }
    if(re && re.epa_play!==undefined) erow('Rush EPA/play', re.epa_play+' (#'+re.epa_play_rk+')');
    if(ef) erow('Early-down success', '#'+ef.ed_success);
    if(ef) erow('Early-down pass EPA (Q1-3)', '#'+ef.ed_pass_q13);
    if(ef) erow('Explosive play rate', '#'+ef.explosive_play);
    if(ef) erow('3rd-down conversion', '#'+ef.third_conv);
    if(erows) rows += '<div class="edge" style="border-bottom:none;padding-top:10px;"><span class="lab" style="font-weight:700;color:#8fa3bd;">Efficiency (EPA/success)</span><span></span></div>'+erows;
  }
  return '<div class="card"><h3>'+name+'</h3>'+rows+'</div>';
}

function buildSignals(away, home, awayN, homeN){
  var s = [];
  var adj = {awayAdj:0, homeAdj:0};
  // helper: add a signal and apply a point delta to a named team's expected pts
  function addPts(teamN, pts){ if(teamN===awayN) adj.awayAdj+=pts; else adj.homeAdj+=pts; }

  // NOTE: the old "offVsDef" signal (elite offense vs weak defense = +2 pts) was REMOVED because it
  // double-counted the core Four Factors rating, which already measures offense-vs-defense on the
  // points-per-drive scale. Signals below only add information the core does NOT already contain
  // (trench pressure, QB coverage, red-zone finishing, turnovers). We still SHOW the core edge as an
  // informational line (no points added) so the user sees which side the model favours.
  {
    var aOR = away.offense_2025 && away.offense_2025.pts_per_drive_rk;
    var hDR = home.defense_2025 && home.defense_2025.pts_per_drive_rk;
    if(aOR && hDR && aOR<=8 && hDR>=22) s.push('<li>&#129001; <b>'+awayN+'</b> offense (#'+aOR+' pts/drive) vs a weak <b>'+homeN+'</b> defense (#'+hDR+') — already reflected in the score.</li>');
    var hOR = home.offense_2025 && home.offense_2025.pts_per_drive_rk;
    var aDR = away.defense_2025 && away.defense_2025.pts_per_drive_rk;
    if(hOR && aDR && hOR<=8 && aDR>=22) s.push('<li>&#129001; <b>'+homeN+'</b> offense (#'+hOR+' pts/drive) vs a weak <b>'+awayN+'</b> defense (#'+aDR+') — already reflected in the score.</li>');
  }

  // --- RED ZONE FINISHING MATCHUP ---
  // Distinct from raw scoring: of drives that REACH the red zone, what fraction end in a TD?
  //   rz_finish = td_per_drive_pct / rz_drive_pct  (a team's RZ TD-conversion rate)
  // A strong finisher vs a leaky RZ defense (or a settle-for-FG offense vs an elite RZ D) is a real,
  // separable edge. RZ rates are noisy so we regress ~50% toward the league finish rate, and cap the
  // points swing small (+/-1.5) since gross scoring is already in the core. (#10/#34/#35 adapted.)
  var LG_RZ_FINISH = 0.72;   // league-avg fraction of RZ trips that become TDs (~0.72)
  var RZ_REG = 0.5;
  function rzFinish(side){ // side = offense_2025 or defense_2025 object
    if(!side || side.td_per_drive_pct==null || !side.rz_drive_pct) return LG_RZ_FINISH;
    var f = side.td_per_drive_pct / side.rz_drive_pct;         // raw finish rate
    if(f>1) f=1;
    return LG_RZ_FINISH + (1-RZ_REG)*(f - LG_RZ_FINISH);        // regressed toward mean
  }
  function rzMatch(off, offN, def, defN){
    var offFin = rzFinish(off.offense_2025);       // this offense's RZ TD conversion
    var defFin = rzFinish(def.defense_2025);       // opponent's RZ TD conversion ALLOWED
    var edge = offFin - defFin;                    // + => offense finishes better than opp allows
    // ~7 pts per RZ TD vs ~3 per FG => a full conversion-rate point is worth ~4 pts across ~3 RZ trips.
    var pts = Math.max(-1.5, Math.min(1.5, edge * 4 * 1.0));
    if(Math.abs(pts) >= 0.6){
      addPts(offN, pts);
      if(pts>0) s.push('<li>&#129001; <b>'+offN+'</b> finishes red-zone trips ('+Math.round(offFin*100)+'% TD) vs a soft <b>'+defN+'</b> red-zone defense ('+Math.round(defFin*100)+'% allowed) — finishing edge (+'+pts.toFixed(1)+' pts).</li>');
      else s.push('<li>&#128293; <b>'+defN+'</b> tightens in the red zone ('+Math.round(defFin*100)+'% TD allowed) vs a settle-for-FG <b>'+offN+'</b> ('+Math.round(offFin*100)+'% TD) — finishing disadvantage ('+pts.toFixed(1)+' pts '+offN+').</li>');
    }
  }
  rzMatch(away, awayN, home, homeN);
  rzMatch(home, homeN, away, awayN);

  // Four Factors efficiency edge (informational — already in the projected score, so no addPts).
  var aEdge = expectedPointsFF(away, home), hEdge = expectedPointsFF(home, away);
  if(Math.abs(hEdge-aEdge) >= 3){
    var eTeam = (hEdge>aEdge)?homeN:awayN;
    s.push('<li>&#128200; <b>'+eTeam+'</b> holds the <b>Four Factors efficiency edge</b> (points/drive matchup) — reflected in the projected score.</li>');
  }

  // QB gap. Quarterback is the single biggest positional factor: the full best-to-replacement
  // spread value is ~7 pts. Scale by rank gap: ~0.13 pts per rank of separation, capped ~2.5.
  // (Part of QB value is already in roster score, so we keep the coefficient conservative.)
  var aq=(away.positional_ranks||{}).Quarterbacks, hq=(home.positional_ranks||{}).Quarterbacks;
  if(aq&&hq){
    var qg=Math.abs(aq-hq);
    if(qg>=8){
      var better=aq<hq?awayN:homeN; var w=aq<hq?aq:hq, l=aq<hq?hq:aq;
      var qpts=Math.min(2.5, qg*0.13);
      addPts(better,+qpts);
      s.push('<li>&#129001; QB edge: <b>'+better+'</b> (#'+w+') over #'+l+' — quarterback advantage (+'+qpts.toFixed(1)+' pts).</li>');
    }
  }

  // Trenches: offense's O-line vs opposing defensive front, using granular trench_data
  // (pressure rate, sacks, run-D YPC/YBC) with fallback to the Front7/OL positional ranks.
  // passProDone[offN]=true once a pass-protection point swing has fired, so the clean-pocket
  // coverage signal below won't double-count the same "QB has time" edge.
  var passProDone = {};
  trench(away, awayN, home, homeN, s, addPts, passProDone);
  trench(home, homeN, away, awayN, s, addPts, passProDone);

  // Turnovers are ALREADY a component of the Four Factors core rating, so adding a turnover-margin
  // point swing here would double-count. We keep it INFORMATIONAL only (no addPts) — flag a stark
  // turnover mismatch so the user sees it, but don't move the number twice.
  {
    function toEdge(offT, offN, defT, defN){
      var give = offT.offense_2025 && offT.offense_2025.to_per_drive_rk;
      var take = defT.defense_2025 && defT.defense_2025.to_per_drive_rk;
      if(!give || !take) return;
      if(give<=6 && take<=6) s.push('<li>&#129001; <b>'+offN+'</b> protects the ball (#'+give+') vs a takeaway-heavy <b>'+defN+'</b> D (#'+take+') — turnover battle (already in the score).</li>');
      else if(give>=26 && take<=6) s.push('<li>&#128293; <b>'+defN+'</b> forces turnovers (#'+take+') vs giveaway-prone <b>'+offN+'</b> (#'+give+') — turnover risk (already in the score).</li>');
    }
    toEdge(away, awayN, home, homeN);
    toEdge(home, homeN, away, awayN);
  }

  // --- EARLY-DOWN & 3rd-DOWN matchups (guide #8/#9) — INFORMATIONAL ONLY ---
  // Drive-sustaining efficiency (early-down success, 3rd-down conversion, 3-and-out avoidance) is
  // ALREADY the backbone of the Four Factors core (yards/drive, 3-and-out%, points/drive). Adding a
  // separate point swing here would double-count that. So we FLAG a stark mismatch for the user but
  // move NO points. offense down_set_conv (chain-moving) vs opponent defense down_set_conv allowed.
  {
    function chainEdge(offT, offN, defT, defN){
      var oConv = offT.offense_2025 && offT.offense_2025.down_set_conv_rk;   // 1 = best at moving chains
      var dStop = defT.defense_2025 && defT.defense_2025.down_set_conv_rk;   // 1 = best at getting off field
      var oThird = EFF && EFF.off_eff_ranks && EFF.off_eff_ranks[offN] && EFF.off_eff_ranks[offN].third_conv;
      if(oConv && dStop && oConv<=8 && dStop>=24){
        var thirdTxt = oThird ? (' (3rd-down #'+oThird+')') : '';
        s.push('<li>&#129001; <b>'+offN+'</b> sustains drives'+thirdTxt+' (#'+oConv+') vs a <b>'+defN+'</b> D that struggles to get off the field (#'+dStop+') — chain-moving edge (already in the score).</li>');
      } else if(oConv && dStop && oConv>=24 && dStop<=8){
        s.push('<li>&#128293; <b>'+defN+'</b> gets off the field (#'+dStop+') vs a stalling <b>'+offN+'</b> offense (#'+oConv+') — drives stall early (already in the score).</li>');
      }
    }
    chainEdge(away, awayN, home, homeN);
    chainEdge(home, homeN, away, awayN);
  }

  // Totals context
  var aOff=away.offense_2025&&away.offense_2025.pts_per_drive_rk, hOff=home.offense_2025&&home.offense_2025.pts_per_drive_rk;
  var aDef=away.defense_2025&&away.defense_2025.pts_per_drive_rk, hDef=home.defense_2025&&home.defense_2025.pts_per_drive_rk;
  if(aOff&&hOff&&aDef&&hDef){
    if(aOff<=10&&hOff<=10&&aDef>=20&&hDef>=20) s.push('<li>Both offenses strong, both defenses weak — <b>shootout / OVER</b> environment.</li>');
    if(aOff>=22&&hOff>=22&&aDef<=12&&hDef<=12) s.push('<li>Both offenses weak, both defenses strong — <b>low-scoring / UNDER</b> environment.</li>');
  }
  // --- Coverage & pressure matchups (from coverage_data.js) — these MOVE the numbers ---
  if(COV){
    coverageSignals(awayN, homeN, s, addPts, passProDone);
    coverageSignals(homeN, awayN, s, addPts, passProDone);
  }

  if(s.length===0) s.push('<li>No extreme unit mismatches — a relatively balanced matchup on paper.</li>');

  // The core EPA rating already captures most team strength (QB, efficiency, trenches show up in
  // EPA). The signals therefore DOUBLE-COUNT unless dampened — so we scale them down and cap tighter.
  // The pure double-count signals (offense-vs-defense scoring, turnover margin) are now INFORMATIONAL
  // only. The remaining point-moving signals (QB gap, trench pressure, coverage, red-zone finishing)
  // carry information NOT in the core rating, so they need only a light dampener for residual overlap
  // (e.g. QB partly shows up in pts/drive). 0.7 keeps genuine edges meaningful without letting them
  // stack into a touchdown. Cap at +/-3 per side.
  var SIGNAL_DAMP = 0.7;
  adj.awayAdj *= SIGNAL_DAMP;
  adj.homeAdj *= SIGNAL_DAMP;
  adj.awayAdj = Math.max(-3, Math.min(3, adj.awayAdj));
  adj.homeAdj = Math.max(-3, Math.min(3, adj.homeAdj));
  adj.text = s.join('');
  return adj;
}

// Two-way trench matchup. Uses granular trench_data (pass rush + run defense) when available,
// falling back to Front7/OL positional ranks. Splits into a PASS-PROTECTION edge and a RUN-BLOCKING edge.
function trench(off, offN, def, defN, s, addPts, passProDone){
  var offT = TRENCH && TRENCH.teams[offN];   // offense trench profile (O-line side)
  var defT = TRENCH && TRENCH.teams[defN];   // defense trench profile (front side)
  var ol   = (off.positional_ranks||{})["Offensive Line"];
  var f7   = (def.positional_ranks||{})["Front 7"];

  // ---------- PASS PROTECTION vs PASS RUSH ----------
  // Defense pass-rush strength: prefer pressure-rate rank, else sack rank, else Front7 rank.
  var rushRk = (defT && defT.def_pressure_rate_rk) || (defT && defT.def_sacks_rk) || f7;
  // O-line pass protection: prefer pass-block-win-rate rank, else OL positional rank.
  var protRk = (offT && offT.ol_pbwr_rk) || ol;
  if(rushRk && protRk){
    var pgap = rushRk - protRk; // + => protection better than rush (offense edge); - => rush wins
    var pr = defT && defT.def_pressure_rate;
    var sk = defT && defT.def_sacks;
    if(pgap <= -10){ // strong pass rush vs weak protection — the biggest in-play swing in the NFL
      var pen = Math.min(2.8, 1.2 + (-pgap-10)*0.08);
      addPts(offN, -pen);
      if(passProDone) passProDone[offN] = true;  // QB under duress — block the clean-pocket bonus
      var d = pr ? (pr+'% pressure, #'+rushRk+')') : ('#'+rushRk+')');
      s.push('<li>&#128293; <b>'+defN+'</b> pass rush ('+d+' overwhelms <b>'+offN+'</b> pass protection (#'+protRk+')'+(sk?(' — '+sk+' sacks last yr'):'')+' — QB under duress (&minus;'+pen.toFixed(1)+' pts '+offN+').</li>');
    } else if(pgap >= 10){ // strong protection vs weak rush
      var add = Math.min(2.2, 1.0 + (pgap-10)*0.06);
      addPts(offN, +add);
      if(passProDone) passProDone[offN] = true;  // clean-pocket edge already applied here
      var d2 = pr ? (pr+'% pressure, #'+rushRk+')') : ('#'+rushRk+')');
      s.push('<li>&#129001; <b>'+offN+'</b> O-line (#'+protRk+') gives clean pockets vs a soft <b>'+defN+'</b> pass rush ('+d2+' — time to throw (+'+add.toFixed(1)+' pts '+offN+').</li>');
    }
  }

  // ---------- RUN BLOCKING vs RUN DEFENSE ----------
  // Defense run-D strength: prefer YPC-allowed rank, else YBC rank, else Front7 rank.
  var runDefRk = (defT && defT.def_rb_ypc_rk) || (defT && defT.def_ybc_rk) || f7;
  var runBlkRk = (offT && offT.ol_rbwr_rk) || ol; // O-line run-block rank, else OL rank
  if(runDefRk && runBlkRk){
    var rgap = runDefRk - runBlkRk; // + => run blocking better than run D (offense edge)
    var ypc = defT && defT.def_rb_ypc;
    if(rgap <= -12){ // stout run D vs weak run blocking (run game moves the needle less than pass)
      var rpen = Math.min(1.4, 0.6 + (-rgap-12)*0.045);
      addPts(offN, -rpen);
      s.push('<li>&#128293; <b>'+defN+'</b> run defense ('+(ypc?ypc+' YPC, ':'')+'#'+runDefRk+') stones <b>'+offN+'</b>\'s run game (#'+runBlkRk+') — stuffed on the ground (&minus;'+rpen.toFixed(1)+' pts '+offN+').</li>');
    } else if(rgap >= 12){ // good run blocking vs weak run D
      var radd = Math.min(1.4, 0.6 + (rgap-12)*0.045);
      addPts(offN, +radd);
      s.push('<li>&#129001; <b>'+offN+'</b> O-line (#'+runBlkRk+') opens lanes vs a leaky <b>'+defN+'</b> run defense ('+(ypc?ypc+' YPC, ':'')+'#'+runDefRk+') — ground edge (+'+radd.toFixed(1)+' pts '+offN+').</li>');
    }
  }
}

// Find the starting QB for a team (first QB in the map that points to this team).
function qbForTeam(teamN){
  var map = COV.qb_to_team_2026 || {};
  // prefer a QB that also has coverage data
  var candidates = [];
  for(var qb in map){ if(map[qb]===teamN) candidates.push(qb); }
  // pick the one with coverage data (starter usually listed), else first
  for(var i=0;i<candidates.length;i++){ if(COV.qb_coverage_2025[candidates[i]]) return candidates[i]; }
  return candidates[0]||null;
}

function coverageSignals(offN, defN, s, addPts, passProDone){
  var qb = qbForTeam(offN); if(!qb) return;
  var cov = COV.qb_coverage_2025[qb];
  var pr  = COV.qb_pressure_2025[qb];
  var def = COV.def_tendencies[defN];

  // ============================================================================================
  // MATCHUP TRUTH-TABLE LOGIC (per the QB/DEFENSE matchup guide).
  // CORE RULE: match a QB trait against WHAT THE DEFENSE ACTUALLY DOES, and weight by frequency.
  //  - QB strong at X  + defense forces X often  -> tested but holds up  (neutral / slight +)
  //  - QB strong at X  + defense rarely does X    -> strength not utilised (neutral, no points)
  //  - QB weak at X    + defense forces X often    -> WEAKNESS EXPLOITED  (negative)
  //  - QB weak at X    + defense rarely does X      -> weakness hidden     (positive, weakness avoided)
  // "Rank midpoint" = league average: 45 QBs -> ~23; 32 defenses -> ~16.
  // We only have BOTH sides of the data for PRESSURE and BLITZ, so those get the full truth table.
  // (Coverage-type FREQUENCY per defense is NOT in our data, so we do NOT fabricate a man/zone-rate
  // matchup — the coverage block below stays a proxy on secondary strength only.)
  // ============================================================================================
  var QB_MID = 23, DEF_MID = 16;

  // ---- PRESSURE (guide #2): QB under-pressure skill vs defense's pressure-generation rate ----
  var dtr = TRENCH && TRENCH.teams[defN];
  var defPressRk = dtr && dtr.def_pressure_rate_rk;   // 1 = best pass rush (pressures often), 32 = worst
  if(pr && defPressRk){
    var upRk = pr.under_pressure_rk;                  // 1 = best when pressured, 45 = worst
    var qbHandles = upRk <= QB_MID;                   // above-average vs pressure
    var defPressures = defPressRk <= DEF_MID;         // above-average pressure rate
    var pRate = dtr.def_pressure_rate ? dtr.def_pressure_rate+'%, ' : '';
    if(!qbHandles && defPressures){
      // WEAKNESS EXPLOITED — the strongest of the four; scale by how extreme both are.
      var pen = Math.min(2.5, 0.8 + (upRk-QB_MID)*0.05 + (DEF_MID-defPressRk)*0.05);
      addPts(offN, -pen);
      s.push('<li>&#128293; <b>'+qb+'</b> struggles under pressure (#'+upRk+') vs <b>'+defN+'</b>\'s heavy pass rush ('+pRate+'#'+defPressRk+') — pressure exploited (&minus;'+pen.toFixed(1)+' pts '+offN+').</li>');
    } else if(qbHandles && !defPressures && !(passProDone && passProDone[offN])){
      // Strength meets a weak rush — QB stays clean AND is good = real, but modest, edge.
      // Skipped if the trench pass-protection bonus already fired for this offense (no double-count).
      var b1 = Math.min(1.2, 0.5 + (QB_MID-upRk)*0.03 + (defPressRk-DEF_MID)*0.04);
      if(b1>=0.5){ addPts(offN, +b1); s.push('<li>&#129001; <b>'+qb+'</b> is comfortable when pressured (#'+upRk+') and <b>'+defN+'</b> rarely gets home ('+pRate+'#'+defPressRk+') — clean pocket to operate (+'+b1.toFixed(1)+' pts '+offN+').</li>'); }
    } else if(!qbHandles && !defPressures){
      // WEAKNESS HIDDEN — QB is shaky under pressure but won't face much, small positive.
      var b2 = Math.min(0.8, 0.4 + (defPressRk-DEF_MID)*0.03);
      if(b2>=0.4){ addPts(offN, +b2); s.push('<li>&#129001; <b>'+qb+'</b> is shaky under pressure (#'+upRk+') but <b>'+defN+'</b> rarely pressures ('+pRate+'#'+defPressRk+') — weakness avoided (+'+b2.toFixed(1)+' pts '+offN+').</li>'); }
    }
    // qbHandles && defPressures => tested but holds up => NEUTRAL, no points.
  }

  // ---- BLITZ (guide #4): QB vs-blitz skill vs defense's blitz rate ----
  if(pr && def && def.blitz_rk){
    var bz = pr.being_blitzed_rk;      // 1 = best vs blitz, 45 = worst
    var qbBlitzOk = bz <= QB_MID;
    var defBlitzes = def.blitz_rk <= DEF_MID;
    if(qbBlitzOk && defBlitzes){
      // QB punishes the blitz + defense blitzes often = POSITIVE (guide: exploit).
      var bb = Math.min(1.8, 0.7 + (QB_MID-bz)*0.04 + (DEF_MID-def.blitz_rk)*0.05);
      addPts(offN, +bb);
      s.push('<li>&#129001; <b>'+qb+'</b> punishes the blitz (#'+bz+') and <b>'+defN+'</b> blitzes often ('+def.blitz_pct+'%, #'+def.blitz_rk+') — QB exploits aggression (+'+bb.toFixed(1)+' pts '+offN+').</li>');
    } else if(!qbBlitzOk && defBlitzes){
      // QB struggles vs blitz + defense blitzes often = MAJOR WEAKNESS EXPLOITED.
      var bp = Math.min(2.2, 0.8 + (bz-QB_MID)*0.05 + (DEF_MID-def.blitz_rk)*0.05);
      addPts(offN, -bp);
      s.push('<li>&#128293; <b>'+qb+'</b> struggles vs the blitz (#'+bz+') and <b>'+defN+'</b> blitzes often ('+def.blitz_pct+'%, #'+def.blitz_rk+') — blitz weakness exploited (&minus;'+bp.toFixed(1)+' pts '+offN+').</li>');
    }
    // qbBlitzOk && !defBlitzes => strength wasted => NEUTRAL.
    // !qbBlitzOk && !defBlitzes => weakness avoided => small positive already covered by the
    //   pressure "weakness hidden" case above, so we don't add again here (avoid double-count).
  }

  // COVERAGE MATCHUP: QB man/zone/2-high/deep vs opponent secondary.
  // IMPORTANT: man, zone and deep are DIFFERENT VIEWS OF THE SAME THING — a good passer against a
  // weak secondary. Summing them triple-counts one edge (this was inflating every elite QB vs a
  // bottom-8 secondary by up to ~+3.7). So we take the SINGLE STRONGEST coverage edge, not the sum,
  // and report the others as supporting text only. Applies uniformly to all 32 teams.
  if(cov){
    var secRk = (DATA.teams[defN].positional_ranks||{})["Secondary"];
    var covPts = 0;      // net coverage point swing (best single edge)
    var covMsg = '';     // description of the driving edge
    var supports = [];   // supporting (non-scoring) coverage notes
    // Negative edge: QB struggles vs 2-high against an elite secondary.
    if(cov.two_high_rk>=28 && secRk && secRk<=8){
      if(-1.5 < covPts || covPts===0){ covPts = -1.5; covMsg = '&#128293; <b>'+qb+'</b> struggles vs 2-high (#'+cov.two_high_rk+') against a top-'+secRk+' <b>'+defN+'</b> secondary — coverage disadvantage'; }
    }
    // Positive edges vs a weak secondary — keep the largest, list the rest as support.
    var posEdges = [];
    if(cov.man_rk<=6 && secRk && secRk>=24) posEdges.push({p:1.5, t:'elite vs man (#'+cov.man_rk+')'});
    if(cov.zone_rk<=6 && secRk && secRk>=24) posEdges.push({p:1.2, t:'shreds zone (#'+cov.zone_rk+')'});
    if(cov.deep_rk<=5 && secRk && secRk>=22) posEdges.push({p:1.0, t:'top-'+cov.deep_rk+' deep passer'});
    if(posEdges.length){
      posEdges.sort(function(a,b){return b.p-a.p;});
      var best = posEdges[0];
      if(best.p > covPts){ covPts = best.p; covMsg = '&#129001; <b>'+qb+'</b> '+best.t+' vs a weak <b>'+defN+'</b> secondary (#'+secRk+') — passing edge'; }
      for(var i=1;i<posEdges.length;i++) supports.push(posEdges[i].t);
    }
    if(covPts!==0){
      addPts(offN, covPts);
      var supTxt = supports.length ? ' (also '+supports.join(', ')+')' : '';
      var sign = covPts>0 ? '+'+covPts.toFixed(1) : '&minus;'+Math.abs(covPts).toFixed(1);
      s.push('<li>'+covMsg+supTxt+' ('+sign+' pts '+offN+').</li>');
    }
  }
}

load();
</script>
